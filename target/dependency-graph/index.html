<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dependency Graph</title>
  <style>
    body { margin: 0; background: #f3f4f6; font-family: Helvetica, Arial, sans-serif; }
    #chart { width: 100%; overflow: auto; padding: 20px; box-sizing: border-box; }
    svg { display: block; margin: 0 auto; background: #f3f4f6; }
    .node { font: 300 11px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #bbb; }
    .node:hover { fill: #000; }
    .link { stroke: steelblue; stroke-opacity: .4; fill: none; pointer-events: none; }
    .node:hover, .node-transitive-target, .node-transitive-source, .node--source, .node--target { font-weight: 700; }
    .node--source { fill: #2ca02c; }
    .node-transitive-target { fill: #931919; }
    .node-transitive-source { fill: #1ee232; }
    .node--target { fill: #d62728; }
    .link-transitive-target, .link-transitive-source, .link--source, .link--target { stroke-opacity: 1; stroke-width: 2px; }
    .link--source { stroke: #d62728; }
    .link-transitive-target { stroke: #931919; }
    .link-transitive-source { stroke: #1ee232; }
    .link--target { stroke: #2ca02c; }
  </style>
</head>
<body>
  <div id="chart" align="left"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
  <script src="./dependency-graph-data.js"></script>
  <script>
    var myData = window.dependencyGraphData || [];
    var diameter = 850, radius = diameter / 2, innerRadius = radius - 100;
    var cluster = d3.layout.cluster().size([360, innerRadius]).sort(null).value(function(d) { return d.size; });
    var bundle = d3.layout.bundle();
    var line = d3.svg.line.radial().interpolate("bundle").tension(.85).radius(function(d) { return d.y; }).angle(function(d) { return d.x / 180 * Math.PI; });
    var svg = d3.select("#chart").append("svg").attr("width", diameter).attr("height", diameter).append("g").attr("transform", "translate(" + radius + "," + radius + ")");
    var link = svg.append("g").selectAll(".link"), node = svg.append("g").selectAll(".node");
    var nodes = cluster.nodes(packageHierarchy(myData)), links = packageImports(nodes);
    link = link.data(bundle(links)).enter().append("path").each(function(d) { d.source = d[0]; d.target = d[d.length - 1]; var actualTarget = d.source.imports.filter(function(e) { return e.substring(e.lastIndexOf(" ") + 1) == d.target.name; })[0]; var targetAttrib = actualTarget ? actualTarget.substring(0, actualTarget.lastIndexOf(" ")).trim() : ""; d.targetAttrib = targetAttrib; }).attr("class", "link").attr("d", line);
    node = node.data(nodes.filter(function(n) { return !n.children; })).enter().append("text").attr("class", "node").attr("dy", ".31em").attr("transform", function(d) { return "rotate(" + (d.x - 90) + ")translate(" + (d.y + 8) + ",0)" + (d.x < 180 ? "" : "rotate(180)"); }).style("text-anchor", function(d) { return d.x < 180 ? "start" : "end"; }).text(function(d) { return d.key; }).on("mouseover", mouseovered).on("mouseout", mouseouted);
    function mouseovered(d) {
      node.each(function(n) { n.target = n.source = false; n.targetAttrib = ""; n.transExp = ""; });
      link.classed("link--target", function(l) { if (l.target === d) { if (l.targetAttrib == 'transitive') { l.source.transExp = 'transitive'; l.transExp = 'transitive'; l.source.source = true; return false; } else { return l.source.source = true; } } }).classed("link--source", function(l) { if (l.source === d) { if (l.targetAttrib == 'transitive') { l.target.targetAttrib = 'transitive'; l.target.target = true; return false; } else { return l.target.target = true; } } }).classed("link-transitive-target", function(l) { if (l.source === d) { return l.targetAttrib == 'transitive'; } }).classed("link-transitive-source", function(l) { if (l.target === d) { return l.transExp == 'transitive'; } }).filter(function(l) { return l.target === d || l.source === d; }).each(function() { this.parentNode.appendChild(this); });
      node.classed("node--target", function(n) { return n.target && n.targetAttrib != 'transitive'; }).classed("node-transitive-target", function(n) { return n.targetAttrib == 'transitive'; }).classed("node--source", function(n) { return n.source && n.transExp != 'transitive'; }).classed("node-transitive-source", function(n) { return n.transExp == 'transitive'; });
    }
    function mouseouted(d) {
      link.classed("link--target", false).classed("link--source", false).classed("link-transitive-target", false).classed("link-transitive-source", false);
      node.classed("node--target", false).classed("node--source", false).classed("node-transitive-target", false).classed("node-transitive-source", false);
    }
    d3.select(self.frameElement).style("height", diameter + "px");
    function packageHierarchy(classes) {
      var map = {};
      function find(name, data) { var node = map[name], i; if (!node) { node = map[name] = data || { name: name, children: [] }; if (name.length) { node.parent = find(name.substring(0, i = name.lastIndexOf("-"))); node.parent.children.push(node); node.key = name.substring(i + 1); } } return node; }
      classes.forEach(function(d) { find(d.name, d); });
      return map[''];
    }
    function packageImports(nodes) {
      var map = {}, imports = [];
      nodes.forEach(function(d) { map[d.name] = d; });
      nodes.forEach(function(d) { if (d.imports) { d.imports.forEach(function(i) { var reqImport = i.substring(i.lastIndexOf(" ") + 1); imports.push({ source: map[d.name], target: map[reqImport] }); }); } });
      return imports;
    }
  </script>
</body>
</html>
